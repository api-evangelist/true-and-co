description: >-
  Shopify-native, hosted Model Context Protocol server exposing True & Co's catalog,
  cart, and checkout to shopping agents via the Universal Commerce Protocol. Payment
  completion always requires contemporaneous human buyer approval.
# Tools/capabilities are DERIVED from the published UCP capability manifest and the
