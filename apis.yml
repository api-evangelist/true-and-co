name: True & Co
description: >-
  True & Co is a direct-to-consumer women's intimates and lingerie brand,
  originally venture-backed (Cowboy Ventures, Uncork Capital) and now operating
  under PVH Corp. It sells bras, underwear, and loungewear online through a
  Shopify-hosted storefront at trueandco.com. The store exposes no traditional
  developer API, but it does expose a modern agent-commerce surface: a hosted
  Universal Commerce Protocol (UCP) MCP endpoint for catalog, cart, and checkout,
  Shopify Customer Account OAuth 2.0 / OIDC for buyer identity, a public
  read-only storefront JSON surface, and an agent-facing llms.txt / agents.md.
